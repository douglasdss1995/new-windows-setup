# =============================================================================
# docker-compose.yml — Providers (Serviços Compartilhados)
# Serviços: PostgreSQL, Valkey, Portainer (automáticos)
# pgAdmin, MailHog, MinIO e SeaweedFS são manuais — ver profiles
#
# Este arquivo é copiado para ~/providers/ pelo provision.sh.
# Para uso manual: cp -r wsl/providers ~/providers
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TZ: ${TZ:-America/Manaus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./providers/postgres/init:/docker-entrypoint-initdb.d
    command: >
      postgres
        -c shared_buffers=256MB
        -c max_connections=200
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
    networks:
      - shared-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  valkey:
    image: valkey/valkey:9-alpine
    container_name: valkey
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${VALKEY_PORT:-${REDIS_PORT:-6379}}:6379"
    volumes:
      - valkey_data:/data
      - ./providers/valkey/valkey.conf:/usr/local/etc/valkey/valkey.conf
    command: valkey-server /usr/local/etc/valkey/valkey.conf
    networks:
      - shared-network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320m
        reservations:
          memory: 128m

  # Não sobe automaticamente com `docker compose up -d`.
  # Para iniciar manualmente: docker compose --profile pgadmin up -d pgadmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    profiles:
      - pgadmin
    logging: *default-logging
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      TZ: ${TZ:-America/Manaus}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./providers/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shared-network
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m

  # Opcional e manual — não sobe com `docker compose up -d` nem com a máquina.
  # Para iniciar: docker compose --profile minio up -d minio
  # (A imagem community do MinIO foi descontinuada — prefira o SeaweedFS.)
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: "no"
    profiles:
      - minio
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: ${TZ:-America/Manaus}
    ports:
      - "${MINIO_PORT_API:-9000}:9000"
      - "${MINIO_PORT_CONSOLE:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - shared-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  # Opcional e manual — não sobe com `docker compose up -d` nem com a máquina.
  # Para iniciar: docker compose --profile seaweedfs up -d seaweedfs
  # Modo single-container: master (9333) + volume + filer (8888) + gateway S3 (8333).
  # Credenciais S3 em ./providers/seaweedfs/s3.json
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    restart: "no"
    profiles:
      - seaweedfs
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/Manaus}
    ports:
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"
      - "${SEAWEEDFS_FILER_PORT:-8888}:8888"
      - "${SEAWEEDFS_MASTER_PORT:-9333}:9333"
    volumes:
      - seaweedfs_data:/data
      - ./providers/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    command: server -dir=/data -filer -s3 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0
    networks:
      - shared-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${PORTAINER_HTTP_PORT:-8001}:9000"
      - "${PORTAINER_HTTPS_PORT:-8443}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - shared-network
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m

  # Não sobe automaticamente com `docker compose up -d`.
  # Para iniciar manualmente: docker compose --profile mailhog up -d mailhog
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped
    profiles:
      - mailhog
    logging: *default-logging
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - shared-network
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m

networks:
  shared-network:
    name: shared-network
    driver: bridge

volumes:
  postgres_data:
  valkey_data:
  pgadmin_data:
  minio_data:
  seaweedfs_data:
  portainer_data:
