# =============================================================================
# wsl.conf — Configuração por distro do WSL
# Local: /etc/wsl.conf  (dentro do Debian)
# Aplicar: wsl --shutdown  (no PowerShell do Windows)
# =============================================================================

[boot]
# Iniciar o systemd (necessário para Docker nativo, serviços, etc.)
systemd=true

# Comando executado ao iniciar a distro (opcional)
# command=

[automount]
# Montar drives do Windows automaticamente (ex: /mnt/c, /mnt/d)
enabled=true

# Diretório raiz dos mounts automáticos
root=/mnt/

# Opções de montagem dos drives Windows
# uid/gid: mapear para o usuário atual do Linux (evita problemas de permissão)
# fmask/dmask: permissões padrão para arquivos e diretórios montados
options="metadata,uid=1000,gid=1000,umask=022,fmask=011"

# Processar /etc/fstab ao iniciar
mountFstab=true

[network]
# Nome do host da distro WSL
hostname=dev-wsl

# Gerar /etc/hosts automaticamente
generateHosts=true

# Gerar /etc/resolv.conf automaticamente
generateResolvConf=true

[interop]
# Permitir execução de binários Windows dentro do WSL (ex: code ., explorer.exe)
enabled=true

# Adicionar $PATH do Windows ao PATH do WSL
# Desabilitar pode melhorar performance de startup do shell, mas quebra "code ."
appendWindowsPath=true

[user]
# Usuário padrão ao abrir a distro (substitua pelo seu usuário Linux)
# default=seu_usuario
