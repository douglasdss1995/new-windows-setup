name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: choco install shellcheck -y --no-progress

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Lint
        shell: pwsh
        run: ./lint.ps1

      - name: Test
        shell: pwsh
        run: ./test.ps1

  # The bash tests that exercise real Linux behavior (symlinks, git include
  # paths) skip themselves under Git Bash on Windows, so run them on Linux too.
  bash-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash tests
        run: |
          set -e
          for t in tests/bash/*.test.sh; do
            echo "== $t =="
            bash "$t"
          done
