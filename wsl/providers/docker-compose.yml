# =============================================================================
# docker-compose.yml — Providers (Serviços Compartilhados)
# Serviços: PostgreSQL, Redis, Portainer, MinIO (automáticos)
# pgAdmin e MailHog são manuais — ver profiles
#
# Este arquivo é copiado para ~/providers/ pelo provision.sh.
# Para uso manual: cp -r wsl/providers ~/providers
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TZ: ${TZ:-America/Manaus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./providers/postgres/init:/docker-entrypoint-initdb.d
    command: >
      postgres
        -c shared_buffers=256MB
        -c max_connections=200
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
    networks:
      - shared-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./providers/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - shared-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320m
        reservations:
          memory: 128m

  # Não sobe automaticamente com `docker compose up -d`.
  # Para iniciar manualmente: docker compose --profile pgadmin up -d pgadmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    profiles:
      - pgadmin
    logging: *default-logging
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      TZ: ${TZ:-America/Manaus}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./providers/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shared-network
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: ${TZ:-America/Manaus}
    ports:
      - "${MINIO_PORT_API:-9000}:9000"
      - "${MINIO_PORT_CONSOLE:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - shared-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${PORTAINER_HTTP_PORT:-8001}:9000"
      - "${PORTAINER_HTTPS_PORT:-8443}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - shared-network
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m

  # Não sobe automaticamente com `docker compose up -d`.
  # Para iniciar manualmente: docker compose --profile mailhog up -d mailhog
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped
    profiles:
      - mailhog
    logging: *default-logging
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - shared-network
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m

networks:
  shared-network:
    name: shared-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  minio_data:
  portainer_data:
